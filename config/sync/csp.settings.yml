_core:
  default_config_hash: 68A3PDsSIoX2q7iFOa2lMdnYkgKgem4uh1_RBxcRVWU
report-only:
  enable: false
  directives:
    object-src:
      base: none
    script-src:
      base: self
      flags:
        - report-sample
    style-src:
      base: self
      flags:
        - report-sample
    webrtc: block
    worker-src:
      base: self
    base-uri:
      base: self
    form-action:
      base: self
    frame-ancestors:
      base: self
  reporting:
    plugin: none
enforce:
  enable: true
  directives:
    default-src:
      base: self
    script-src:
      base: self
    style-src:
      base: self
      flags:
        - unsafe-inline
    img-src:
      base: self
      sources:
        - 'data:'
    font-src:
      base: self
      sources:
        - 'data:'
    media-src:
      base: self
    connect-src:
      base: self
    frame-src:
      base: self
      sources:
        - 'https://www.youtube.com'
        - 'https://www.youtube-nocookie.com'
        - 'https://player.vimeo.com'
        - 'https://www.openstreetmap.org'
    object-src:
      base: none
    worker-src:
      base: self
    base-uri:
      base: self
    form-action:
      base: self
    frame-ancestors:
      base: self
  reporting:
    plugin: none
