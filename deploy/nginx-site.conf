# The host's nginx in front of a DDEV site.
#
# Copy to /etc/nginx/sites-available/example.com, replace example.com and the
# port (host_webserver_port in .ddev/config.local.yaml), enable it, then let
# certbot add the certificate and the HTTPS redirect:
#
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Uploads; keep in line with PHP's upload_max_filesize.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Drupal needs the name the visitor asked for, their address and
        # whether they came over HTTPS.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
    }
}
