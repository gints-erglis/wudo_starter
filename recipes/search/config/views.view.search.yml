langcode: en
status: true
dependencies:
  config:
    - search_api.index.content
  module:
    - search_api
id: search
label: Search
module: views
description: 'Search page of the site, on the "content" search index.'
tag: ''
base_table: search_api_index_content
base_field: search_api_id
display:
  default:
    id: default
    display_title: Default
    display_plugin: default
    position: 0
    display_options:
      title: Search
      fields:
        search_api_excerpt:
          id: search_api_excerpt
          table: search_api_index_content
          field: search_api_excerpt
          plugin_id: search_api
          label: ''
          element_label_colon: false
      pager:
        type: full
        options:
          items_per_page: 10
      exposed_form:
        type: input_required
        options:
          submit_button: Search
          reset_button: false
          text_input_required: ''
          text_input_required_format: basic_html
      access:
        type: none
      cache:
        type: search_api_tag
      empty:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          plugin_id: text_custom
          empty: true
          content: 'Nothing found. Try another word, or fewer of them.'
      sorts:
        search_api_relevance:
          id: search_api_relevance
          table: search_api_index_content
          field: search_api_relevance
          plugin_id: search_api
          order: DESC
      filters:
        search_api_fulltext:
          id: search_api_fulltext
          table: search_api_index_content
          field: search_api_fulltext
          plugin_id: search_api_fulltext
          operator: and
          exposed: true
          expose:
            operator_id: search_api_fulltext_op
            label: 'Search this site'
            identifier: keys
            required: false
            placeholder: Search
          parse_mode: terms
          min_length: 2
        search_api_language:
          id: search_api_language
          table: search_api_index_content
          field: search_api_language
          plugin_id: search_api_language
          operator: in
          value:
            '***LANGUAGE_language_interface***': '***LANGUAGE_language_interface***'
      style:
        type: default
      row:
        type: fields
      query:
        type: search_api_query
      header:
        result:
          id: result
          table: views
          field: result
          plugin_id: result
          content: 'Results: @total'
      display_extenders: {  }
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_interface'
        - url
        - url.query_args
        - 'user.node_grants:view'
      tags:
        - 'config:search_api.index.content'
        - 'search_api_list:content'
  page:
    id: page
    display_title: Page
    display_plugin: page
    position: 1
    display_options:
      display_extenders: {  }
      path: search
    cache_metadata:
      max-age: -1
      contexts:
        - 'languages:language_interface'
        - url
        - url.query_args
        - 'user.node_grants:view'
      tags:
        - 'config:search_api.index.content'
        - 'search_api_list:content'
