wudo_theme_extension.settings:
  type: config_object
  label: 'Wudo Theme Extension settings'
  mapping:
    api_views:
      type: sequence
      label: 'Views available through /api/views'
      sequence:
        type: string
        label: 'View ID'

block.settings.wudo_search:
  type: block_settings
  label: 'Search button and drawer'
  mapping:
    drawer_id:
      type: string
      label: 'Drawer ID'
    display_mode:
      type: string
      label: 'Display'
