wudo_theme_extension.favorites_api:
  path: '/api/favorites'
  defaults:
    _controller: '\Drupal\wudo_theme_extension\Controller\FavoriteApiController::getTeasers'
  requirements:
    _permission: 'access content'

wudo_theme_extension.views_render:
  path: '/api/views/{view_id}/{display_id}'
  defaults:
    _controller: '\Drupal\wudo_theme_extension\Controller\ViewsRenderController::render'
    display_id: 'default'
  requirements:
    _permission: 'access content'

wudo_theme_extension.search_api:
  path: '/api/search'
  defaults:
    _controller: '\Drupal\wudo_theme_extension\Controller\SearchApiController::search'
  requirements:
    _permission: 'access content'
