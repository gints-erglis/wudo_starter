'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Quantity Input
description: "Number field with buttons that decrease and increase it; a plain number field without JavaScript."
status: stable
group: Atoms

props:
  type: object
  properties:
    value:
      type: integer
      title: Current quantity
      default: 1
    min:
      type: integer
      title: Minimum quantity
      default: 1
    max:
      type: integer
      title: Maximum quantity (stock)
      examples:
        - 10
    step:
      type: integer
      title: Step
      default: 1
    name:
      type: string
      title: Field name
      description: The name of the field the component makes when the input slot is empty.
      examples:
        - quantity
    label:
      type: string
      title: Label
      description: The accessible name of the field the component makes; a field of a form has its own label.
      examples:
        - Quantity

slots:
  input:
    title: Input
    description: A number field of its own, e.g. that of a Drupal form, with its name, ID and limits. The buttons read min, max and step from it.
    examples:
      - '<input type="number" name="quantity" value="2" min="1" max="10" step="1" aria-label="Quantity">'
