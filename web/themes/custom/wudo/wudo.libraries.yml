# Main theme library.
global:
  css:
    theme:
      dist/style.css: {}
      # The site's own layer comes after everything else; see site/README.md.
      dist/site.css: { weight: 100 }
      assets/fonts/fonts.css: { weight: -20 }
  js:
    js/color-scheme.js: { minified: false }

print:
  css:
    theme:
      dist/print.css: { media: print }

focus-trap:
  js:
    components/00-base/01-primitives/focus-trap/focus-trap.js: { minified: false }
  dependencies:
    - core/drupal

parallax:
  js:
    components/00-base/01-primitives/parallax/parallax.js: { minified: false }
  dependencies:
    - core/drupal
    - core/once
